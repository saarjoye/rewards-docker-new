version: '3.8'

services:
  microsoft-rewards:
    # 二开 fork 镜像（GitHub Container Registry 自动构建）
    image: ghcr.io/saarjoye/microsoft-rewards-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-rewards
    restart: unless-stopped
    ports:
      - "5308:5308"
    environment:
      - TZ=Asia/Shanghai
      - PORT=5308
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
