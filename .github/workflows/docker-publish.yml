name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      publish:
        description: '是否推送镜像（关闭则只做构建校验，不推送任何标签）'
        required: false
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 发布策略（全自动，推上去就发）：
      #   push main   -> 构建并推送 latest（latest 永远等于 main 最新代码）
      #   push tag v* -> 构建并推送 版本号 + 主.次 + latest
      #   手动触发     -> 由 publish 入参控制，关掉可只做构建校验
      - name: Determine publish mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仅构建校验，不推送任何镜像标签"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::将构建并发布镜像（linux/amd64 + linux/arm64）"
          fi

      - name: Set up QEMU
        if: steps.mode.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 提取元数据和 Tag
      #    main 推送：只有 latest（自动跟随最新代码）
      #    tag 推送：版本号 + 主.次 + latest
      - name: Extract metadata for Docker
        id: meta
        if: steps.mode.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 4. 构建并推送多架构镜像 (linux/amd64, linux/arm64)
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ steps.mode.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.mode.outputs.publish == 'true' }}
          # 仅构建校验时 meta 步骤被跳过、outputs.tags 为空，必须给一个本地占位 tag，
          # 否则 docker/build-push-action 会因缺少 tag 直接报错。
          tags: ${{ steps.mode.outputs.publish == 'true' && steps.meta.outputs.tags || 'rewards-docker-new:build-check' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
